name: Analysis feedback
description: Share a useful or noisy Actions Cost Guard finding without posting private workflow contents.
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Please do not include workflow contents, credentials, proprietary logs, or other private information.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Found an actionable cost risk
        - Finding was not actionable
        - Analysis failed
        - Feature request
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      description: For example, ACG001. Leave blank if not applicable.
  - type: textarea
    id: summary
    attributes:
      label: Non-sensitive summary
      description: What happened, and what would make the result more useful?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed workflow contents, credentials, proprietary logs, and private information.
          required: true
